name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal, mps]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --python 3.13 --extra test
      - name: Run the fallback-disabled compatibility suite
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: uv run pytest -q
      - name: Require the real-world API corpus to resolve
        run: |
          PYTHONPATH=src .venv/bin/python tools/api_compat/ecosystem_gate.py \
            --corpus artifacts/api_compat/ecosystem-api.json \
            --output "$RUNNER_TEMP/ecosystem-gate.json"
      - name: Verify the candidate wheel through unchanged applications
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/candidate"
          uv venv --clear "$RUNNER_TEMP/candidate-environment"
          uv pip install --python "$RUNNER_TEMP/candidate-environment/bin/python" \
            "$RUNNER_TEMP"/candidate/*.whl
          .venv/bin/python tools/application_compat/run.py run \
            --python "$RUNNER_TEMP/candidate-environment/bin/python" \
            --backend metal --expect-device mps \
            --wheel "$RUNNER_TEMP"/candidate/*.whl \
            --output "$RUNNER_TEMP/application-compat"
      - name: Enforce the Apple Silicon performance ceilings
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: |
          results="$RUNNER_TEMP/release-performance"
          mkdir -p "$results"
          PYTHONPATH=src .venv/bin/python benchmarks/kinematics/benchmark_fk.py --device mps --batch-sizes 1024 --warmup 3 --iterations 7 --output "$results/fk.json"
          PYTHONPATH=src .venv/bin/python benchmarks/collision/benchmark_collision.py --device mps --batch-sizes 512 --warmup 3 --iterations 7 --output "$results/collision.json"
          PYTHONPATH=src .venv/bin/python benchmarks/ik/benchmark_ik.py --device mps --repeats 3 --output "$results/ik.json"
          PYTHONPATH=src .venv/bin/python benchmarks/trajectory/benchmark_trajectory.py --device mps --repeats 5 --output "$results/trajectory.json"
          PYTHONPATH=src .venv/bin/python benchmarks/graph_planning/benchmark_graph_planning.py --device mps --repeats 5 --output "$results/graph.json"
          PYTHONPATH=src .venv/bin/python benchmarks/perception/benchmark_perception.py --device mps --iterations 7 --output "$results/perception.json"
          .venv/bin/python tools/performance/release_gate.py --input "$results" --output "$results/gate.json"

  build:
    needs: verify
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - name: Require a clean version tag for a production release
        if: github.event_name == 'release'
        run: |
          expected="v$(uv run --no-project --python 3.13 python -c 'from pathlib import Path; import re; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/curobo_metal/_version.py").read_text()).group(1))')"
          test "${{ github.event.release.tag_name }}" = "$expected"
      - name: Build once
        run: uv build --wheel --sdist --out-dir dist
      - name: Validate metadata
        run: |
          uvx twine check dist/*
          uv run --no-project --python 3.13 python \
            tools/packaging/check_distribution_contents.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
