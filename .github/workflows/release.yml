name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Require a clean version tag for a production release
        if: github.event_name == 'release'
        run: |
          expected="v$(python -c 'from pathlib import Path; import re; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/curobo_metal/_version.py").read_text()).group(1))')"
          test "${{ github.event.release.tag_name }}" = "$expected"
      - name: Build once
        run: uv build --wheel --sdist --out-dir dist
      - name: Validate metadata
        run: |
          uvx twine check dist/*
          python tools/packaging/check_distribution_contents.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
