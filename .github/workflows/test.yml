name: test

on:
  push:
  pull_request:

jobs:
  api-inventory:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check pinned cuRobo API inventory
        run: |
          upstream_dir="$(mktemp -d)/curobo"
          git clone --filter=blob:none --no-checkout \
            https://github.com/NVlabs/curobo.git "$upstream_dir"
          git -C "$upstream_dir" checkout \
            8e734f3ced1df898990bcd92de40abce475907db
          python tools/api_compat/generate.py \
            --source "$upstream_dir" \
            --local-root src \
            --output artifacts/api_compat/upstream-api.json \
            --check
      - name: Validate upstream test and example census
        run: |
          python tools/api_compat/upstream_execution_census.py \
            --inventory artifacts/api_compat/upstream-api.json \
            --census artifacts/api_compat/upstream-execution-census.json
      - name: Require exact documented public facades for alpha
        run: |
          python tools/api_compat/surface_gate.py \
            --inventory artifacts/api_compat/upstream-api.json \
            --local-root src \
            --public-facades-only \
            --require-exact-exports

  cpu:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python "${{ matrix.python-version }}" --extra test
      - run: PYTHONPATH=.:src PYTORCH_ENABLE_MPS_FALLBACK=0 uv run pytest -q
      - name: Require the real-world API corpus to resolve
        if: matrix.python-version == '3.13'
        run: |
          PYTHONPATH=src .venv/bin/python tools/api_compat/ecosystem_gate.py \
            --corpus artifacts/api_compat/ecosystem-api.json \
            --output "$RUNNER_TEMP/ecosystem-gate.json"
      - name: Test installed wheel namespace and assets
        run: |
          uv build --wheel --out-dir dist
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tools/packaging/wheel_smoke.py"
      - name: Import every pinned runtime namespace from the installed wheel
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tools/api_compat/runtime_imports.py" \
            --inventory "$GITHUB_WORKSPACE/artifacts/api_compat/upstream-api.json" \
            --require-installed-wheel

      - name: Verify unchanged portable applications on CPU
        run: |
          .venv/bin/python tools/application_compat/run.py run \
            --python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --backend metal --expect-device cpu \
            --wheel "$GITHUB_WORKSPACE"/dist/*.whl \
            --output "$RUNNER_TEMP/application-compat-cpu"

  macos:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal, mps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra test
      # Hosted Apple runners can report MPS as available while retaining a
      # near-zero shared-pool ceiling.  Keep fallback disabled, but remove
      # the allocator's conservative high-watermark cap for this test job.
      - run: PYTHONPATH=.:src PYTORCH_ENABLE_MPS_FALLBACK=0 PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0 uv run pytest -q
      - name: Test installed wheel namespace and assets
        run: |
          uv build --wheel --out-dir dist
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tools/packaging/wheel_smoke.py"
      - name: Import every pinned runtime namespace from the installed wheel
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tools/api_compat/runtime_imports.py" \
            --inventory "$GITHUB_WORKSPACE/artifacts/api_compat/upstream-api.json" \
            --require-installed-wheel

      - name: Verify unchanged portable applications on MPS
        run: |
          PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0 .venv/bin/python tools/application_compat/run.py run \
            --python "$GITHUB_WORKSPACE/.venv/bin/python" \
            --backend metal --expect-device mps \
            --wheel "$GITHUB_WORKSPACE"/dist/*.whl \
            --output "$RUNNER_TEMP/application-compat-mps"
      - name: Preserve MPS application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-compat-mps
          path: ${{ runner.temp }}/application-compat-mps

  distributions:
    runs-on: [self-hosted, macOS, ARM64, curobo-metal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build --wheel --sdist --out-dir dist
      - name: Validate distribution metadata
        run: |
          uvx twine check dist/*
          python tools/packaging/check_distribution_contents.py dist/*
      - name: Install and test wheel in a clean environment
        run: |
          uv venv /tmp/curobo-metal-wheel
          uv pip install --python /tmp/curobo-metal-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/curobo-metal-wheel/bin/python \
            "$GITHUB_WORKSPACE/tools/packaging/wheel_smoke.py"
          uv pip check --python /tmp/curobo-metal-wheel/bin/python
      - name: Install and test sdist in a separate clean environment
        run: |
          uv venv /tmp/curobo-metal-sdist
          uv pip install --python /tmp/curobo-metal-sdist/bin/python dist/*.tar.gz
          cd /tmp
          /tmp/curobo-metal-sdist/bin/python \
            "$GITHUB_WORKSPACE/tools/packaging/wheel_smoke.py"
          uv pip check --python /tmp/curobo-metal-sdist/bin/python
