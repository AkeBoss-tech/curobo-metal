name: test

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra test
      - run: PYTORCH_ENABLE_MPS_FALLBACK=0 uv run pytest -q

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra test
      - run: PYTORCH_ENABLE_MPS_FALLBACK=0 uv run pytest -q
