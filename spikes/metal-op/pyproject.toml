[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curobo-metal-op-spike"
version = "0.1.0"
description = "Minimal autograd-compatible PyTorch custom Metal operation"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=2.0", "torch==2.13.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
