[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curobo-metal"
version = "0.0.0"
description = "Portable correctness foundations for cuRobo Metal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "torch>=2.13"]

[project.optional-dependencies]
test = ["pytest>=7.4", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curobo = [
  "content/**/*.dae",
  "content/**/*.obj",
  "content/**/*.urdf",
  "content/**/*.yml",
  "content/**/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = [".", "src"]
